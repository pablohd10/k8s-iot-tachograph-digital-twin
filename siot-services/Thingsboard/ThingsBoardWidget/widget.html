<!-- This is the HTML code for the widget. -->
<form #routeAssignmentForm="ngForm" (submit)="sendCommand()">
      
    <div class="mat-content mat-padding" fxLayout="column">     
        <!-- Form field for the device ID -->
        <mat-form-field class="mat-block">       
            <mat-label>Tachograph to Configure:</mat-label>       
            <input matInput required name="tachographToConfigure" #originField="ngModel" [(ngModel)]="tachographToConfigure"/>       
            <mat-error *ngIf="originField.hasError('required')">         
                Tachograph to Configure is required.       
            </mat-error>     
        </mat-form-field>    
        
        <!-- Form field for the route ID -->
        <mat-form-field class="mat-block">       
            <mat-label>Telemetry Publication Frequency:</mat-label>       
            <input matInput required name="telemetryFrequency" #originField="ngModel" [(ngModel)]="telemetryFrequency"/>       
            <mat-error *ngIf="originField.hasError('required')">         
                Telemetry Frequency is required.       
            </mat-error>
        </mat-form-field>
        
        <!-- Form field for the destination -->
        <mat-form-field class="mat-block">       
            <mat-label>Sensors Sampling Frequency:</mat-label>       
            <input matInput required name="sensorsFrequency" #destinationField="ngModel" [(ngModel)]="sensorsFrequency"/>       
            <mat-error *ngIf="destinationField.hasError('required')">         
                Sensors Sampling Frequency.       
            </mat-error>     
        </mat-form-field>
        
        <!-- Button to submit the form -->
        <button [disabled]="routeAssignmentForm.invalid || !routeAssignmentForm.dirty" mat-raised-button color="primary" type="submit" >       
            Modify Tachograph Configuration     
        </button> 
        
        <!-- Display the response from the server -->
        <div>       
            <label>Tachograph Configuration Response</label>       
            <div style="width: 100%; height: 100px; border: solid 2px gray" [innerHTML]="routeAssignmentResponse">
            </div>     
        </div>   
    </div> 
</form>
